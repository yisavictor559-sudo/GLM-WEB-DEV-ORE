<!DOCTYPE html>
<html>
<head>
    <title>AI Ad Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Ad Click Predictor 🤖</h2>
        <p>Enter user details to see if they will click the ad.</p>
        
        <input type="number" id="age" placeholder="Age (e.g., 50)">
        <input type="number" id="time" placeholder="Time on site (e.g., 25)">
        <br>
        <button onclick="predict()">Predict!</button>
        
        <div id="result"></div>
    </div>

    <script>
        function predict() {
            const age = document.getElementById('age').value;
            const time = document.getElementById('time').value;
            const resultDiv = document.getElementById('result');

            if (!age || !time) {
                resultDiv.innerHTML = "Please enter both age and time!";
                resultDiv.style.color = "red";
                return;
            }

            resultDiv.innerHTML = "Thinking...";
            resultDiv.style.color = "black";

            // Talk to our Python API
            fetch(`http://127.0.0.1:5000/predict?age=${age}&time=${time}`)
                .then(response => response.json())
                .then(data => {
                    if (data.prediction === 1) {
                        resultDiv.innerHTML = "✅ Prediction: 1 (Will Click!)";
                        resultDiv.style.color = "green";
                    } else {
                        resultDiv.innerHTML = "❌ Prediction: 0 (Will NOT Click)";
                        resultDiv.style.color = "red";
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = "Error connecting to API.";
                    resultDiv.style.color = "red";
                });
        }
    </script>
</body>
</html>
